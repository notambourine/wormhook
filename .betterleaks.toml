title = "wormhook secret-scan config"

# Read by the `secrets` job in .github/workflows/validate.yml. CI cannot reach a
# developer's machine-local overlay, so the rule below is committed here on
# purpose: without it CI runs stock rules and misses the one credential class this
# repo is most likely to leak.
[extend]
useDefault = true

# Stock owns sk-ant-api03- and sk-ant-admin01-, both anchored to an exact 93-char
# body. Neither covers the Claude Code OAuth pair (sk-ant-oat01- access,
# sk-ant-ort01- refresh) that this plugin's users hold in ~/.claude/.credentials.json
# — verified against betterleaks 1.7.3, which reports "no leaks" on a bare oat01
# token. Prefix-agnostic so a new Anthropic credential format is caught the day it
# ships. The id must not collide with a stock id: an [extend] rule reusing one
# REPLACES the default it names.
[[rules]]
id = "anthropic-key-any-prefix"
description = "Any sk-ant- credential, including the OAuth pair stock rules miss"
regex = '''sk-ant-[a-zA-Z0-9_-]{32,}'''
keywords = ["sk-ant-"]
