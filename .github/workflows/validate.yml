name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install Claude Code CLI
        run: sfw npm install -g @anthropic-ai/claude-code

      # Allow only the root maintainer-context warning; all other schema findings fail.
      - name: Validate plugin schema
        run: |
          # GitHub runs `run:` under `bash -e`, so a bare assignment from a failing
          # command would abort before the allowlist below ever reads its output.
          rc=0; out=$(claude plugin validate . --strict 2>&1) || rc=$?
          printf '%s\n' "$out"
          findings=$(printf '%s\n' "$out" | grep '❯' | grep -vF 'AGENTS.md at the plugin root' || true)
          if [ -n "$findings" ]; then
            echo "::error::unexpected validate findings (see above)"; exit 1
          fi
          # Non-zero with no findings left means it failed for a reason we cannot allowlist.
          if [ "$rc" -ne 0 ] && ! printf '%s\n' "$out" | grep -qF 'AGENTS.md at the plugin root'; then
            exit "$rc"
          fi

      - name: ShellCheck the scanner
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Default severity floor (style/info), not -S warning: the new CLI is the
          # whole product, and SC2015-class footguns are exactly what we want red.
          # scripts/doctor/*.sh (the split SessionStart checks) are NOT covered by the
          # non-recursive scripts/*.sh glob -- list the subdir explicitly.
          shellcheck scripts/*.sh scripts/doctor/*.sh tests/*.sh

      - name: Run engine fixtures harness
        run: bash tests/run.sh

      - name: Assert doctor checks present + executable
        run: |
          test -f scripts/doctor/_utils.sh || { echo "::error::scripts/doctor/_utils.sh missing"; exit 1; }
          # Derive the check list from hooks.json (single source of truth) — no hand-maintained
          # list or count to drift. Each registered check must exist + be executable; deps.sh must
          # be FIRST (absent or not-first and the jq-missing alarm it owns silently never fires).
          checks=$(jq -r '.hooks.SessionStart[].hooks[].command | select(test("doctor/")) | capture("doctor/(?<f>[a-z_-]+[.]sh)").f' hooks/hooks.json)
          [ -n "$checks" ] || { echo "::error::no doctor checks registered in hooks.json"; exit 1; }
          [ "$(printf '%s\n' "$checks" | head -1)" = "deps.sh" ] || { echo "::error::deps.sh must be the first SessionStart doctor hook"; exit 1; }
          printf '%s\n' "$checks" | while read -r c; do
            f="scripts/doctor/$c"
            test -f "$f" || { echo "::error file=$f::registered doctor check missing"; exit 1; }
            test -x "$f" || { echo "::error file=$f::doctor check not executable (chmod +x)"; exit 1; }
          done
          echo "registered doctor checks present + executable; deps.sh first"

      - name: Verify integrity manifest matches the engine
        run: |
          (cd scripts && shasum -a 256 -c integrity.sha256) || {
            echo "::error file=scripts/integrity.sha256::stale integrity manifest — regenerate: (cd scripts && shasum -a 256 wormhook.sh malware-patterns.sh > integrity.sha256)"
            exit 1
          }

      - name: Require version bump when behavior changes (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- scripts/ hooks/ ':(exclude,glob)scripts/**/*.md' ':(exclude,glob)hooks/**/*.md'; then
            echo "no behavior change (scripts/, hooks/) -- version bump not required"
            exit 0
          fi
          old=$(git show "$BASE_SHA:.claude-plugin/plugin.json" | jq -r '.version // "0.0.0"')
          new=$(jq -r '.version // "0.0.0"' .claude-plugin/plugin.json)
          if [ "$old" = "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::scripts/ or hooks/ changed but version is still $old -- bump it (fix: patch, feat: minor, breaking: major)"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)" != "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::version went backwards: $old -> $new"
            exit 1
          fi
          echo "version bump OK: $old -> $new"

  wormhook-self:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan this repo with wormhook's own action
        uses: ./
        with:
          mode: fast

  secrets:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Scan full history for secrets
        # Resolve fresh secret rules each run; verify the release signature before using the binary.
        # Stay anonymous: the betterleaks org IP allow list rejects any token-bearing request.
        run: |
          # Unpack OUTSIDE the workspace: a 20 MB Go binary of compressed entropy is
          # exactly what a secret scanner is built to flag.
          cd "$RUNNER_TEMP"
          REPO=https://github.com/betterleaks/betterleaks
          TAG=$(curl -fsSI "$REPO/releases/latest" | tr -d '\r' | sed -n 's#^location: .*/tag/##Ip')
          test -n "$TAG"
          for f in "betterleaks_${TAG#v}_linux_x64.tar.gz" checksums.txt checksums.txt.sigstore.json; do
            curl -fsSLO "$REPO/releases/download/$TAG/$f"
          done
          # NEVER pipe cosign: `run:` is `bash -e` WITHOUT pipefail, so a pipe swallows
          # a verify failure and the job proceeds on an unverified binary.
          # No --new-bundle-format: deprecated in cosign 3.x, where it is the default.
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/betterleaks/betterleaks/.github/workflows/release.yml@refs/tags/${TAG}" \
            checksums.txt
          grep linux_x64 checksums.txt | sha256sum -c -
          tar -xzf betterleaks_*_linux_x64.tar.gz betterleaks
          # --redact so a finding never prints the credential into a public CI log.
          # No --validation: it is opt-in in the CLI and stays off -- a gate must not
          # phone vendor APIs with candidate secrets.
          # --confidence medium (needs betterleaks >=1.8.0) is what keeps this gate quiet
          # as upstream broadens its rules: only the three generic rules grade a hit from
          # its surrounding context, so a detection fixture lands below the bar and no
          # rule that names an issuer is affected.
          ./betterleaks git "$GITHUB_WORKSPACE" --no-banner --redact=100 --confidence medium

  # Tripwire covers generic workflow exfiltration beyond the campaign signatures here.
  tripwire:
    uses: notambourine/shai-hulud-tripwire/.github/workflows/tripwire.yml@1047f6fd7c10fed2b574dc783039e4cf9e4065e1 # v1.2.0
    permissions:
      contents: read
    with:
      allow-globs: |
        README.md
        scripts/wormhook.sh
        scripts/malware-patterns.sh
        tests/run.sh
