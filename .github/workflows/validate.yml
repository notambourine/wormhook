name: validate

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: this workflow only reads the checkout. Without
# this, the token defaults to write scopes a compromised step could abuse.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Egress monitoring of the runner itself (StepSecurity). Must be the first
      # step. audit = observe-only, never blocks; the per-run insights link in the
      # log shows observed endpoints. Graduate to egress-policy: block + an
      # allowed-endpoints allowlist once a few audit runs have mapped the egress.
      # Community tier is public-repos-only — applies here (wormhook is public).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only CI (lint/scan, no git push, no .git/ artifact upload), so
          # don't persist the token into .git/config (zizmor artipacked).
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Socket Firewall Free (keyless) installs the `sfw` proxy into the job;
      # the install step below runs through it so a package flagged malicious
      # AFTER this lockfile-less `npm install -g` resolves still gets blocked at
      # fetch time — the time-of-check->time-of-use gap a PR-time scan can't close.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install Claude Code CLI
        run: sfw npm install -g @anthropic-ai/claude-code

      # Schema-validates marketplace.json, plugin.json, and skill/agent/hook
      # frontmatter. --strict promotes unrecognized-field warnings to errors.
      - name: Validate plugin + marketplace schema
        run: claude plugin validate . --strict

      # NB: the two description fields serve DIFFERENT roles by design and are NOT
      # kept in sync -- marketplace.json carries a short browse-list tagline, plugin.json
      # the full IOC detail shown at install/inspect time. There is intentionally no
      # parity check (the platform has no shared-field mechanism, so a copy would only
      # be drift waiting to happen). See CLAUDE.md "Invariants".

      # The hook is the whole product here -- lint it so a broken edit can't ship.
      - name: ShellCheck the scanner
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Default severity floor (style/info), not -S warning: the new CLI is the
          # whole product, and SC2015-class footguns are exactly what we want red.
          # scripts/doctor/*.sh (the split SessionStart checks) are NOT covered by the
          # non-recursive scripts/*.sh glob -- list the subdir explicitly.
          shellcheck scripts/*.sh scripts/doctor/*.sh tests/*.sh

      # Fixtures seam over the engine: {synthetic payload + planted files in a temp
      # CWD} -> assert on the emitted verdict JSON. Proves the engine DETECTS the
      # campaigns it claims (per-tier positives), holds its FP exclusions (the
      # adc-e.uk partition-table collision fixed in v0.15.2), keeps the two block-
      # event emission shapes distinct (PreToolUse deny vs UserPromptSubmit block),
      # and that the installed git-hook body never self-flags (the CLAUDE.md
      # "Verified by test" claim). Zero network; each case is hermetic ($HOME +
      # XDG_CACHE_HOME redirected into a temp dir). A wrong verdict exits non-zero
      # and fails the build.
      - name: Run engine fixtures harness
        run: bash tests/run.sh

      # Presence-assert for the split doctor checks. The jq-missing "scans are OFF" 🔴
      # alarm is owned solely by doctor/deps.sh (every other check stays silent when jq
      # is absent), so a missing/non-exec deps.sh would silently disarm the one alarm the
      # doctor exists to raise. This turns that corruption case into a red PR instead of a
      # user's silent SessionStart. _utils.sh is sourced (not executed), so it is checked
      # for existence only, not the +x bit.
      - name: Assert doctor checks present + executable
        run: |
          test -f scripts/doctor/_utils.sh || { echo "::error::scripts/doctor/_utils.sh missing"; exit 1; }
          # Derive the check list from hooks.json (single source of truth) — no hand-maintained
          # list or count to drift. Each registered check must exist + be executable; deps.sh must
          # be FIRST (absent or not-first and the jq-missing alarm it owns silently never fires).
          checks=$(jq -r '.hooks.SessionStart[].hooks[].command | select(test("doctor/")) | capture("doctor/(?<f>[a-z_-]+[.]sh)").f' hooks/hooks.json)
          [ -n "$checks" ] || { echo "::error::no doctor checks registered in hooks.json"; exit 1; }
          [ "$(printf '%s\n' "$checks" | head -1)" = "deps.sh" ] || { echo "::error::deps.sh must be the first SessionStart doctor hook"; exit 1; }
          printf '%s\n' "$checks" | while read -r c; do
            f="scripts/doctor/$c"
            test -f "$f" || { echo "::error file=$f::registered doctor check missing"; exit 1; }
            test -x "$f" || { echo "::error file=$f::doctor check not executable (chmod +x)"; exit 1; }
          done
          echo "registered doctor checks present + executable; deps.sh first"

      # The integrity light (doctor/integrity.sh, issue #61) verifies the engine +
      # signature corpus against scripts/integrity.sha256 at every SessionStart. This
      # keeps the manifest honest: an engine edit that forgets to regenerate it would
      # otherwise ship a permanent false-🔴 to every install. Combined with the
      # version-bump tripwire below, an engine change needs BOTH a fresh manifest and
      # a version move to go green.
      - name: Verify integrity manifest matches the engine
        run: |
          (cd scripts && shasum -a 256 -c integrity.sha256) || {
            echo "::error file=scripts/integrity.sha256::stale integrity manifest — regenerate: (cd scripts && shasum -a 256 wormhook.sh malware-patterns.sh > integrity.sha256)"
            exit 1
          }

      # Makes the "Two sources of truth" invariant executable (CLAUDE.md): which commands
      # trigger a scan is encoded twice — the *_RE regexes in wormhook.sh (the precise gate)
      # and the `if` globs in hooks.json (the coarse perf pre-filter). The contract is `if` ⊇
      # regex: `if` BROADER is a free wasted spawn, but `if` NARROWER means the hook silently
      # never fires and the scan is skipped with no signal. This derives the gated verbs FROM
      # the regexes (npm/pnpm/yarn/bun/npx/node, the pip*/uv/python* set, and git ops as
      # `git <sub>`) and asserts each has a covering Bash(<verb> *) glob in the right event.
      # UserPromptSubmit is exempt — its payload carries no command, so its hook entry has no
      # `if` (it gates purely on EVENT). Reads only repo files (no workflow inputs); no edits.
      - name: Assert if-globs cover the gated regexes (if ⊇ regex)
        run: |
          HOOK=scripts/wormhook.sh
          HOOKS_JSON=hooks/hooks.json
          regex_of() { sed -n "s/^$1='\(.*\)'\$/\1/p" "$HOOK"; }
          # Command-coverage prefixes a regex gates, one per line. Non-git verbs collapse to
          # the command NAME (Bash(npm *) covers every npm subcommand); git ops expand to
          # `git <sub>` (globs are per-subcommand). Top-level `|` split honors paren depth.
          regex_verbs() {
            local re="$1" body branch inner s
            body="${re#^\\s\*}"
            if [[ "$body" == git* ]]; then
              local subs _subs
              subs=$(printf '%s' "$body" | sed -n 's/.*(\(pull[^)]*\))(\\s|\$).*/\1/p')
              IFS='|' read -ra _subs <<< "$subs"
              for s in "${_subs[@]}"; do printf 'git %s\n' "$s"; done
              return
            fi
            body="${body#(}"; body="${body%(\\s|\$)}"; body="${body%)}"
            printf '%s' "$body" | awk '{
              depth=0; br="";
              for(i=1;i<=length($0);i++){c=substr($0,i,1);
                if(c=="(")depth++; else if(c==")")depth--;
                if(c=="|"&&depth==0){print br; br="";} else br=br c;}
              print br;
            }' | while IFS= read -r branch; do
              if [[ "$branch" == \(* ]]; then
                inner="${branch#(}"; inner="${inner%%)*}"
                printf '%s\n' "${inner//|/$'\n'}"
              else
                printf '%s\n' "$branch" | sed -n 's/^\([a-z0-9]\{1,\}\).*/\1/p'
              fi
            done
          }
          if_verbs() { printf '%s' "$1" | grep -oE 'Bash\([^)]*\)' | sed -E 's/^Bash\(//; s/\)$//; s/ ?\*$//'; }
          ifstr() { jq -r ".hooks.$1[0].hooks[0].\"if\" // \"\"" "$HOOKS_JSON"; }
          verbs_of() { regex_verbs "$(regex_of "$1")"; }
          # Fail loud if a regex name no longer resolves. MUST run in the top-level shell (not
          # inside the $( … | sort) pipelines below): an exit there only kills the subshell and
          # the script would pass while coverage silently regressed — the invisible-failure
          # class this check exists to catch.
          for _name in GATE_RE PYGATE_RE INSTALL_RE GIT_RE PYINSTALL_RE; do
            [[ -n "$(regex_of "$_name")" ]] || { echo "::error file=$HOOK::regex $_name not found (renamed?) — cannot verify if-coverage"; exit 1; }
          done
          fail=0
          assert_superset() {  # $1=event  $2=required(newline)  $3=covered(newline)
            local label="$1" required="$2" covered="$3" v
            while IFS= read -r v; do
              [[ -z "$v" ]] && continue
              if ! printf '%s\n' "$covered" | grep -qxF "$v"; then
                echo "::error file=hooks/hooks.json::$label if-glob does not cover gated verb '$v' (if narrower than regex — the hook would silently never fire for it; add Bash($v *) to the if)"
                fail=1
              fi
            done <<< "$required"
          }
          PRE_REQ=$( { verbs_of GATE_RE; verbs_of PYGATE_RE; } | sort -u )
          POST_REQ=$( { verbs_of INSTALL_RE; verbs_of GIT_RE; verbs_of PYINSTALL_RE; } | sort -u )
          assert_superset "PreToolUse"  "$PRE_REQ"  "$(if_verbs "$(ifstr PreToolUse)")"
          assert_superset "PostToolUse" "$POST_REQ" "$(if_verbs "$(ifstr PostToolUse)")"
          if [[ "$fail" == 0 ]]; then
            echo "if ⊇ regex OK — PreToolUse: $(echo "$PRE_REQ" | tr '\n' ' ')"
            echo "                PostToolUse: $(echo "$POST_REQ" | tr '\n' ' ')"
          fi
          exit "$fail"

      # Versioning is manual; this tripwire turns "forgot to bump" into a red X
      # instead of silent drift. Behavior lives in scripts/ + hooks/ -- docs- and
      # CI-only PRs need no bump. Diffs against the PR's recorded base SHA (exact
      # "what this PR changes", immune to base-branch drift); the sort -V check
      # additionally requires the version to move FORWARD, not merely differ.
      - name: Require version bump when behavior changes (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- scripts/ hooks/; then
            echo "no behavior change (scripts/, hooks/) -- version bump not required"
            exit 0
          fi
          old=$(git show "$BASE_SHA:.claude-plugin/plugin.json" | jq -r '.version // "0.0.0"')
          new=$(jq -r '.version // "0.0.0"' .claude-plugin/plugin.json)
          if [ "$old" = "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::scripts/ or hooks/ changed but version is still $old -- bump it (fix: patch, feat: minor, breaking: major)"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)" != "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::version went backwards: $old -> $new"
            exit 1
          fi
          echo "version bump OK: $old -> $new"

  # ── Dogfood: run wormhook's OWN action.yml against wormhook's own tree ──
  # action.yml ("run the engine in CI") ships in this repo but had no coverage on
  # its own source. This exercises it on every push/PR and self-asserts the tree is
  # clean by the exact engine the plugin ships -- eat our own dog food. harden-runner
  # in audit mode doubles as evidence for the "no network calls -- ever" invariant:
  # the run's egress-insights link shows the scan step makes zero outbound calls.
  # Source-only tree (no node_modules to deep-walk) -> mode: fast.
  wormhook-self:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only CI (lint/scan, no git push, no .git/ artifact upload), so
          # don't persist the token into .git/config (zizmor artipacked).
          persist-credentials: false
      - name: Scan this repo with wormhook's own action
        uses: ./
        with:
          mode: fast

  # ── Secret scanning: the gate a stranger or a --no-verify push still hits ──
  # Local git hooks scan staged changes and the pushed range, but they are defeated
  # by --no-verify, by a clone without the binary, and by any other contributor.
  # This job is also the only gate that reads full history instead of a diff.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing: `betterleaks git` walks commits, and the default shallow
          # checkout hands it one. A key committed last month would scan clean.
          fetch-depth: 0
          persist-credentials: false

      # Stays PINNED while betterleaks below does not: cosign is a build tool, so a
      # frozen version scans nothing; betterleaks is a signature scanner, whose value
      # IS the ruleset that shipped this week.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Scan full history for secrets
        # betterleaks is resolved fresh EVERY RUN, deliberately unpinned: a version pin
        # scans with whatever ruleset shipped the day this file was written, and no
        # dependabot ecosystem covers a release tarball, so the pin would freeze by
        # hand. Safe only because the release is VERIFIED, not trusted: cosign binds
        # checksums.txt to betterleaks' own release.yml at the resolved tag, then
        # sha256sum binds the tarball to that verified checksums.txt. Drop the cosign
        # step and this becomes "run whatever the release page serves today".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh release view/download
        run: |
          # Unpack OUTSIDE the workspace: a 20 MB Go binary of compressed entropy is
          # exactly what a secret scanner is built to flag.
          cd "$RUNNER_TEMP"
          TAG=$(gh release view -R betterleaks/betterleaks --json tagName -q .tagName)
          gh release download "$TAG" -R betterleaks/betterleaks \
            -p 'betterleaks_*_linux_x64.tar.gz' -p checksums.txt -p checksums.txt.sigstore.json
          # NEVER pipe cosign: `run:` is `bash -e` WITHOUT pipefail, so a pipe swallows
          # a verify failure and the job proceeds on an unverified binary.
          # No --new-bundle-format: deprecated in cosign 3.x, where it is the default.
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/betterleaks/betterleaks/.github/workflows/release.yml@refs/tags/${TAG}" \
            checksums.txt
          grep linux_x64 checksums.txt | sha256sum -c -
          tar -xzf betterleaks_*_linux_x64.tar.gz betterleaks
          # --redact so a finding never prints the credential into a public CI log.
          # No --validation: it is opt-in in the CLI and stays off -- a gate must not
          # phone vendor APIs with candidate secrets.
          ./betterleaks git "$GITHUB_WORKSPACE" --no-banner --redact=100

  # ── Complementary layer: shai-hulud-tripwire (committed-persistence artifacts) ──
  # wormhook's block tier DELIBERATELY does not flag generic secrets-context workflow
  # exfil or pull_request_target abuse -- too FP-prone (malware-patterns.sh
  # MALWARE_WORKFLOW_RE matches only named campaign slugs). This reusable workflow
  # specializes in exactly that tree-committed persistence pattern, so it is additive,
  # not redundant. Offline + zero-secret (contents: read). Non-gating here: validate
  # holds no secrets to gate via needs:, so the value is as a required status check
  # behind a branch ruleset, not as a job barrier. allow-globs MIRRORS the in-tree
  # .tripwire-allow so CI and the local SessionStart tripwire hook agree on what is a
  # documented-IOC false positive (filename/hash/lifecycle hits are never exempted).
  tripwire:
    uses: notambourine/shai-hulud-tripwire/.github/workflows/tripwire.yml@d58d0e6e2185e1388a4e1fc96f246115b9fd216b # v1.1.3
    permissions:
      contents: read
    with:
      allow-globs: |
        README.md
        scripts/wormhook.sh
        scripts/malware-patterns.sh
